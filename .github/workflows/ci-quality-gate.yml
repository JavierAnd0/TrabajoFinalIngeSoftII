name: "EduDistribuida USCO-Net — CI/CD Quality Gate (Hexagonal, OWASP, WCAG & E2E)"

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  SUPABASE_JWT_SECRET: "ci-github-actions-jwt-secret-key-min-32-chars-usco-net-2026"
  AI_PROVIDER: "deterministic"

jobs:
  # ============================================================================
  # JOB 1: AUDITORÍA DE ARQUITECTURA HEXAGONAL, HIGIENE GIT Y TIPADO TYPESCRIPT
  # ============================================================================
  build-and-hexagonal-audit:
    name: "1. Build Monorepo, Prisma & Pureza Hexagonal"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del Repositorio Monorepo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS con Caché de NPM Workspaces
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Verificar Higiene de Secretos (.env no rastreado en Git)
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1 || git ls-files --error-unmatch packages/database/.env >/dev/null 2>&1; then
            echo "❌ ERROR CRÍTICO DE SEGURIDAD: Archivo .env detectado en el índice de Git."
            exit 1
          fi
          echo "✅ Higiene de Secretos Verificada: Ningún archivo .env está en el control de versiones."

      - name: Verificar Pureza de Capa de Dominio (Arquitectura Hexagonal)
        run: |
          echo "🔍 Escaneando capas src/domain/ contra acoplamiento de infraestructura (express, @prisma/client, bullmq, supabase)..."
          FORBIDDEN_IMPORTS=$(grep -rnE "from ['\"](express|@prisma/client|bullmq|@supabase)" apps/*/src/domain/ || true)
          if [ -n "$FORBIDDEN_IMPORTS" ]; then
            echo "❌ VIOLACIÓN DE ARQUITECTURA HEXAGONAL EN CAPA DE DOMINIO:"
            echo "$FORBIDDEN_IMPORTS"
            exit 1
          fi
          echo "✅ Pureza Hexagonal 100% Verificada en los 3 microservicios."

      - name: Instalar Dependencias del Monorepo (Clean Install)
        run: npm ci

      - name: Generar Cliente Tipado de Prisma ORM (@edudistribuida/database)
        run: npm run db:generate

      - name: Compilar los 5 Paquetes del Monorepo (TypeScript Strict + Astro SSR)
        run: npm run build:all

  # ============================================================================
  # JOB 2: SISTEMA REAL — OWASP DE CAJA NEGRA + E2E PLAYWRIGHT
  # Levanta PostgreSQL 16, Redis 7 y los 4 servicios; ninguna prueba usa réplicas
  # en memoria. Antes este job auditaba servidores Express simulados.
  # ============================================================================
  real-system-gate:
    name: "2. Sistema real: OWASP caja negra + E2E Playwright"
    runs-on: ubuntu-latest
    needs: build-and-hexagonal-audit
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edudistribuida
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      INTERNAL_SERVICE_TOKEN: "ci-internal-service-token-min-32-chars-usco-2026"
      PAYMENT_WEBHOOK_SECRET: "ci-payment-webhook-secret-min-32-chars-usco-2026"

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias, preparar .env y base de datos
        run: |
          npm ci
          cp .env.example .env
          npm run db:generate
          npm run db:push
          npm run db:seed

      - name: Levantar los 4 servicios y esperar a que respondan
        run: |
          for s in core worker chatbot web; do nohup npm run dev:$s > /tmp/$s.log 2>&1 & done
          for i in $(seq 1 60); do
            curl -fsS localhost:4001/health >/dev/null && curl -fsS localhost:4002/health >/dev/null \
              && curl -fsS localhost:4003/health >/dev/null && curl -fsS -o /dev/null localhost:4321/login && exit 0
            sleep 2
          done
          tail -n 40 /tmp/*.log; exit 1

      - name: Suite E2E Playwright (E2E-01 a E2E-05) contra el sistema real
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -- --trace off

      - name: Auditoría OWASP Top 10 de caja negra (falla el build si un control no pasa)
        run: npm run test:security

      - name: Publicar reportes y logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-real-system-reports
          path: |
            qa-audits/security-owasp/owasp-blackbox-report.json
            qa-audits/e2e-playwright/playwright-report/
            /tmp/*.log
          retention-days: 30

  # ============================================================================
  # JOB 3: AUDITORÍA DE USABILIDAD HEURÍSTICA (NIELSEN) Y ACCESIBILIDAD WCAG 2.1 AA
  # ============================================================================
  usability-wcag-gate:
    name: "3. Auditoría de Usabilidad Nielsen & WCAG 2.1 AA"
    runs-on: ubuntu-latest
    needs: build-and-hexagonal-audit
    timeout-minutes: 10

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Ejecutar Auditoría Heurística de Usabilidad y Contraste W3C WCAG 2.1 AA
        run: node qa-audits/usability-heuristics/run-usability-audit.mjs

